repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.5.15"
    hooks:
      - id: biome-check
        additional_dependencies: [ "@biomejs/biome@2.6.4" ]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [ --no-progress, --min-severity=medium, --min-confidence=medium ]
