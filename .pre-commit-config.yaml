repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.5.14"
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.9"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --min-severity=medium, --min-confidence=medium]
